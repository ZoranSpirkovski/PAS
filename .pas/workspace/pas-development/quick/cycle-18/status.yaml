directive: |
  Quiet the Stop hook — gate-skip paths must produce no stderr.

  Cycle-17 made the gate skip the demand when no phase advanced, but
  the skip itself prints a "[PAS] Stop hook: ... — skipping completion
  gate" message to stderr. In a conversational session (e.g. a long-
  running maintainer-style workspace where every Claude yield triggers
  Stop), that stderr appears on every turn alongside "Ran 3 stop hooks"
  cluster. The conversation visually derails even though the gate is
  technically doing the right thing.

  Real fix: silent skip. When the gate decides not to fire, exit 0 with
  no output. Audit route-feedback.sh and any other Stop-fired hook for
  similar no-op stderr noise.

  Plus: small diagnostic improvement — hooks write a one-line debug
  marker to /tmp/pas-hook-<pid>.log so the user can confirm which
  plugin version actually fired without needing CLAUDE_PLUGIN_ROOT to
  be visible in their shell.

