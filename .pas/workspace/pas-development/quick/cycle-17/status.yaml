directive: |
  Fix orchestrator-side session binding to in_progress workspaces.
  Cycle 16 closed the hook-side auto-bind path but the bug recurred in
  consumer projects (transcript: INTERS3CT-LLC/Tangled-Roots-V1
  process-maintainer workspace pas-misrouted-and-migration-ts). Root cause
  is orchestrator-side or consumer-skill-side writes that append the fresh
  session id to `sessions:` and set `current_session:` even though the
  session never advances any phase. Pattern self-reinforces via accumulated
  "off-topic — user pivoted to ..." notes in the same status.yaml.

  Fix targets (1.4.2):
    1. Doctrine: explicitly forbid binding a fresh session to an existing
       in_progress workspace whose phases the session is not advancing.
    2. SessionStart message: reword the unbound-fresh-session branch so it
       reads as a hard "do not register your session here" instruction
       instead of an implicit invitation to manage the foreign workspace.
    3. (Optional) Stop-gate hardening: skip when no phase status mtime
       advanced during this session.

